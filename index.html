<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Прекладе таблиці</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <table>
        <caption>Заголовок таблиці</caption>
        <thead>
            <tr>
                <th colspan="2">Заголовок 1</th>
                <th colspan="2">Заголовок 2</th>
            </tr>
        </thead>
        <tr>
            <td rowspan="2">комірка 1</td>
            <td>комірка 2</td>
            <td>комірка 3</td>
            <td>комірка 4</td>
        </tr>
        <tr>
            <td>комірка 5</td>
            <td>комірка 6</td>
            <td>комірка 7</td>
        </tr>
    </table>
</body>
</html>
